<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gunGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="220" fill="url(#bg)"/>

  <!-- 그리드 라인 -->
  <path d="M 0,55 L 400,55 M 0,110 L 400,110 M 0,165 L 400,165 M 100,0 L 100,220 M 200,0 L 200,220 M 300,0 L 300,220" 
        stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- 총기 실루엣 (M4A1 카빈 스타일) -->
  <g transform="translate(30, 60)">
    <!-- 스톡 (개머리판) -->
    <path d="M 10,40 L 45,40 L 50,55 L 48,70 L 10,75 Z" fill="#334155"/>
    <rect x="45" y="45" width="40" height="10" rx="2" fill="#475569"/>

    <!-- 리시버 (상하부 바디) -->
    <path d="M 85,40 L 180,40 L 180,68 L 135,68 L 125,58 L 85,58 Z" fill="url(#gunGrad)"/>
    <!-- 탄창 -->
    <path d="M 140,68 L 165,68 L 155,115 L 132,112 Z" fill="#1e293b"/>
    <!-- 권총 손잡이 (피스톨 그립) -->
    <path d="M 98,58 L 115,58 L 100,98 L 82,95 Z" fill="#1e293b"/>
    <!-- 방아쇠울 & 방아쇠 -->
    <path d="M 115,58 Q 128,70 135,58" stroke="#334155" stroke-width="2" fill="none"/>
    <path d="M 125,60 L 123,66" stroke="#c084fc" stroke-width="2"/>

    <!-- 핸드가드 (총열덮개) & 레일 -->
    <rect x="180" y="42" width="105" height="22" rx="2" fill="#334155"/>
    <line x1="185" y1="47" x2="280" y2="47" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="185" y1="59" x2="280" y2="59" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- 아웃바렐 (총열) -->
    <rect x="285" y="49" width="45" height="8" fill="#475569"/>
    <!-- 소염기 (플래시 하이더 - 오렌지 팁 안전칼라) -->
    <rect x="330" y="47" width="15" height="12" rx="1" fill="#f97316"/>

    <!-- 상부 캐링핸들/피카티니 레일 & 광학 마운트 -->
    <rect x="105" y="34" width="70" height="6" fill="#475569"/>
    <circle cx="140" cy="26" r="6" fill="#8b5cf6" opacity="0.8"/>
  </g>

  <!-- 모델 뱃지 -->
  <rect x="20" y="16" width="60" height="18" rx="3" fill="rgba(139, 92, 246, 0.2)"/>
  <text x="50" y="29" fill="#a78bfa" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AR-15</text>
  <text x="380" y="200" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="end">M4A1 CARBINE</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="tracerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#tracerBg)"/>
  <!-- 컴팩트 트레이서 실린더 바디 -->
  <rect x="40" y="60" width="120" height="30" rx="4" fill="#1e293b"/>
  <!-- 전면 발광 림 & 녹색 네온 포인트 -->
  <rect x="35" y="63" width="7" height="24" rx="2" fill="#22c55e"/>
  <!-- 널링(미끄럼 방지 무늬) 라인들 -->
  <line x1="60" y1="62" x2="60" y2="88" stroke="#475569" stroke-width="2"/>
  <line x1="70" y1="62" x2="70" y2="88" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="62" x2="80" y2="88" stroke="#475569" stroke-width="2"/>
  <!-- 후면 14mm 나사산 어댑터 -->
  <rect x="155" y="66" width="12" height="18" fill="#334155"/>
  <text x="100" y="125" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">14mm CCW TRACER</text>
</svg>
